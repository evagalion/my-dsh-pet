<!doctype html>
<meta charset="utf-8">
<title>大肥鱼 · 语音试听（Edge 神经网络）</title>
<style>
  :root { --bg:#f7f6f3; --card:#fff; --line:#e6e3dd; --ink:#2c2a26; --sub:#8a857c; --hi:#4f8cff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 32px 60px; background:var(--bg); color:var(--ink);
         font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  h1 { font-size:19px; margin:0 0 6px; }
  .lead { color:var(--sub); font-size:13px; margin:0 0 22px; }
  .grp { margin-bottom:26px; }
  .grp > h2 { font-size:14px; margin:0 0 10px; padding-left:9px; border-left:3px solid var(--hi); }
  .row { display:flex; align-items:center; gap:12px; background:var(--card);
         border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:8px; }
  .row .name { width:150px; font-weight:600; font-size:13px; }
  .row .tag { width:120px; color:var(--sub); font-size:12px; }
  .row .note { flex:1; color:var(--sub); font-size:12px; }
  audio { height:34px; }
  button { border:1px solid var(--line); background:#fff; color:var(--ink);
           border-radius:7px; padding:5px 13px; font-size:12px; cursor:pointer; }
  button:hover { border-color:var(--hi); color:var(--hi); }
  .cfg { margin-top:8px; width:100%; font:11px/1.5 ui-monospace,Menlo,monospace;
         background:#2c2a26; color:#d8d4cc; border:0; border-radius:6px; padding:9px 11px; }
  .hint { margin-top:26px; color:var(--sub); font-size:12px; }
  code { background:#eeece7; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>

<h1>大肥鱼 · 语音试听（Edge 神经网络 TTS）</h1>
<p class="lead">点播放键试听。A = 原速原调，B = 语速 +10% / 音调 +10Hz，C = 语速 +15% / 音调 +20Hz（更萝莉）。<br>
选好后点「复制配置」，把片段贴进 <code>src/shared/pet.config.json</code> 的 <code>sound.voice</code>。</p>

<div id="list"></div>

<p class="hint">
  说明：首次播报需要联网合成一次，之后会缓存到本地 <code>~/Library/Caches/dafeiyu-tts/</code>，
  后续完全离线播放；断网时自动回退到本地 sherpa-onnx 语音包，再不行才用系统 <code>say</code>。
</p>

<script>
const ITEMS = [
  { f:'Xiaoyi-A',   name:'晓伊 Xiaoyi',   tag:'A 原速原调',     note:'活泼女声，微软中文主力音色', v:'zh-CN-XiaoyiNeural',   rate:'+0%',  pitch:'+0Hz' },
  { f:'Xiaoyi-B',   name:'晓伊 Xiaoyi',   tag:'B +10% / +10Hz', note:'稍快稍高，最推荐', v:'zh-CN-XiaoyiNeural',   rate:'+10%', pitch:'+10Hz' },
  { f:'Xiaoyi-C',   name:'晓伊 Xiaoyi',   tag:'C +15% / +20Hz', note:'又快又高，最萝莉', v:'zh-CN-XiaoyiNeural',   rate:'+15%', pitch:'+20Hz' },
  { f:'Xiaoxiao-A', name:'晓晓 Xiaoxiao', tag:'A 原速原调',     note:'温柔知性女声', v:'zh-CN-XiaoxiaoNeural', rate:'+0%',  pitch:'+0Hz' },
  { f:'Xiaoxiao-B', name:'晓晓 Xiaoxiao', tag:'B +10% / +10Hz', note:'温柔偏甜', v:'zh-CN-XiaoxiaoNeural', rate:'+10%', pitch:'+10Hz' },
  { f:'Xiaoxiao-C', name:'晓晓 Xiaoxiao', tag:'C +15% / +20Hz', note:'温柔变萝莉', v:'zh-CN-XiaoxiaoNeural', rate:'+15%', pitch:'+20Hz' },
  { f:'liaoning-Xiaobei-B', name:'晓北（辽宁）', tag:'B +10% / +10Hz', note:'东北腔，幽默搞笑', v:'zh-CN-liaoning-XiaobeiNeural', rate:'+10%', pitch:'+10Hz' },
  { f:'liaoning-Xiaobei-C', name:'晓北（辽宁）', tag:'C +15% / +20Hz', note:'东北小萝莉', v:'zh-CN-liaoning-XiaobeiNeural', rate:'+15%', pitch:'+20Hz' },
  { f:'shaanxi-Xiaoni-B',  name:'晓妮（陕西）', tag:'B +10% / +10Hz', note:'陕西方言，明亮', v:'zh-CN-shaanxi-XiaoniNeural',  rate:'+10%', pitch:'+10Hz' },
];

const el = document.getElementById('list');
el.innerHTML = ITEMS.map((it, i) => `
  <div class="row">
    <span class="name">${it.name}</span>
    <span class="tag">${it.tag}</span>
    <audio controls preload="none" src="samples-edge/${it.f}.mp3"></audio>
    <span class="note">${it.note}</span>
    <button data-i="${i}">复制配置</button>
    <textarea class="cfg" id="cfg${i}" rows="1" readonly hidden></textarea>
  </div>`).join('');

ITEMS.forEach((it, i) => {
  const box = document.getElementById('cfg' + i);
  box.value = JSON.stringify({
    engine: 'edge', voice: it.v, rate: it.rate, pitch: it.pitch
  }, null, 2);
});

el.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const i = b.dataset.i, box = document.getElementById('cfg' + i);
  box.hidden = !box.hidden;
  box.select();
  try { document.execCommand('copy'); } catch (_) {}
  const old = b.textContent; b.textContent = '已复制 ✓';
  setTimeout(() => { b.textContent = old; }, 1200);
});
</script>
