<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src pet: data:; media-src pet:; style-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="slingshot.css" />
  </head>
  <body>
    <div id="bubble" class="bubble">
      <div class="head">
        <span id="bubble-agent" class="badge"></span>
        <span id="bubble-what" class="what"></span>
      </div>
      <span id="bubble-note-tag" class="note-tag">小纸条</span>
      <div id="bubble-text" class="line"></div>
      <div id="bubble-step" class="step"></div>
      <div id="bubble-meta" class="meta"></div>
    </div>
    <div id="stage">
      <video id="v-a" class="pet" muted playsinline preload="auto"></video>
      <video id="v-b" class="pet" muted playsinline preload="auto"></video>
      <div id="hit"></div>
    </div>
    <div id="menu-scrim" class="menu-scrim"></div>
    <div id="action-menu" class="action-menu" role="menu" aria-label="桌宠动作菜单">
      <div class="action-menu-title">想让我做什么？</div>
      <div id="action-menu-items" class="action-menu-items"></div>
    </div>
    <div id="food"></div>
    <script src="slingshot.js"></script>
    <script src="app.js"></script>
  </body>
</html>
